# Sitio del proyecto svdemo, generado por status-sv (ADR-023).
#
# Lo escribió `statussv-agent project accept` (o `project site`). No se edita a
# mano: se cambia la plantilla (en el repo de status-sv, o como root en
# /etc/status-sv/templates/nginx-site.tmpl) y se genera de nuevo.

map $http_upgrade $statussv_upgrade_svdemo {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name svdemo.extendsystem.com;

    # El desafío de Let's Encrypt, para pedir y renovar el certificado.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/statussv-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name svdemo.extendsystem.com;

    ssl_certificate /etc/letsencrypt/live/statussv-svdemo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statussv-svdemo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:18097;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $statussv_upgrade_svdemo;
        proxy_read_timeout 60s;
    }
}
