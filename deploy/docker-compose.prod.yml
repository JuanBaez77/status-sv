# Control plane en producción: PostgreSQL, el control plane y, opcionalmente, Caddy.
#
# Dos formas de exponerlo, según el servidor:
#
#   - Servidor dedicado: con el perfil "caddy", que toma los puertos 80 y 443 y
#     pide el certificado solo.   docker compose --profile caddy up -d
#   - Detrás de un nginx que ya existe: sin perfil. El control plane queda en
#     127.0.0.1 y nginx le pasa el tráfico (ver deploy/nginx/).
#
# En los dos casos la base no tiene puertos en el host y el control plane no es
# alcanzable desde afuera sin pasar por el proxy.
#
# Los secretos salen de deploy/.env, que se genera en el servidor y nunca se
# commitea. El paso a paso está en docs/runbook-despliegue.md.

name: status-sv

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: statussv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: statussv
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statussv -d statussv"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - internal

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
      args:
        VERSION: ${STATUSSV_VERSION:-dev}
        COMMIT: ${STATUSSV_COMMIT:-unknown}
    image: status-sv-server:${STATUSSV_VERSION:-dev}
    restart: unless-stopped
    environment:
      # sslmode=disable es aceptable acá: el tráfico no sale de la red interna
      # de Docker en este mismo host.
      DATABASE_URL: postgres://statussv:${POSTGRES_PASSWORD}@postgres:5432/statussv?sslmode=disable
      STATUSSV_LISTEN_ADDR: 0.0.0.0:8080
      # Caddy llega desde esta red: es el único origen del que se acepta
      # X-Forwarded-For para saber la IP real del cliente.
      STATUSSV_TRUSTED_PROXIES: 172.30.0.0/24
      STATUSSV_LOG_FORMAT: json
      STATUSSV_LOG_LEVEL: ${STATUSSV_LOG_LEVEL:-info}
      # La clave que cifra los secretos TOTP (ADR-013). Vive en un archivo fuera de
      # la base y del repositorio; ver docs/runbook-despliegue.md.
      STATUSSV_TOTP_KEY_FILE: /run/secrets/totp_key
    secrets:
      - totp_key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # El control plane no escribe en disco: todo va a la base.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    ports:
      # Solo en loopback: lo alcanza el nginx del host, nunca internet.
      - "127.0.0.1:${STATUSSV_LOCAL_PORT:-8090}:8080"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # La copia diaria, cifrada y fuera del servidor: la base, la clave TOTP y el
  # .env (deploy/backup/backup.sh). Va con el perfil "backup", que se prende con
  # COMPOSE_PROFILES=backup en deploy/.env, para que un servidor sin el
  # almacenamiento configurado no lo levante.
  backup:
    profiles:
      - backup
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: backup
    image: status-sv-backup:${STATUSSV_VERSION:-dev}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: statussv
      PGDATABASE: statussv
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Sin ":?": el compose se interpola entero en cada comando, y un servidor
      # sin backup no podría ni hacer "up -d server". Si falta, el script lo dice.
      RESTIC_REPOSITORY: ${STATUSSV_BACKUP_REPOSITORY:-}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_ACCESS_KEY_ID: ${STATUSSV_BACKUP_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${STATUSSV_BACKUP_SECRET:-}
      # R2 no tiene regiones; restic necesita una igual.
      AWS_DEFAULT_REGION: auto
      BACKUP_HORA_UTC: ${STATUSSV_BACKUP_HORA_UTC:-06}
      BACKUP_PING_URL: ${STATUSSV_BACKUP_PING_URL:-}
    secrets:
      - totp_key
      - restic_password
    volumes:
      - ./.env:/backup/env/.env:ro
      # El volcado mientras se arma la copia, y la marca de la última buena.
      - backup-work:/work
      # La caché de restic: sin ella, cada copia vuelve a bajar los índices.
      - backup-cache:/cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # unhealthy si la última copia buena tiene más de 26 horas.
      test: ["CMD-SHELL", "test -n \"$$(find /work/ultimo-ok -mmin -1560 2>/dev/null)\""]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 15m
    read_only: true
    tmpfs:
      - /tmp
    # Corre como root para leer el .env (de root, 0600), y DAC_READ_SEARCH le
    # deja leer la clave TOTP, que es del usuario del control plane (0400). No
    # tiene ninguna otra capacidad.
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  caddy:
    profiles:
      - caddy
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STATUSSV_DOMAIN: ${STATUSSV_DOMAIN:?falta STATUSSV_DOMAIN en deploy/.env}
    ports:
      - "${STATUSSV_HTTP_PORT:-80}:80"
      - "${STATUSSV_HTTPS_PORT:-443}:443"
      - "${STATUSSV_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Acá quedan los certificados: si se pierde este volumen, Caddy los vuelve
      # a pedir, y Let's Encrypt limita cuántos se pueden pedir por semana.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  internal:
    ipam:
      config:
        # Fija la red para que STATUSSV_TRUSTED_PROXIES pueda nombrarla.
        - subnet: 172.30.0.0/24

# El archivo se genera en el servidor, con dueño 10001 (el usuario del
# contenedor) y permisos 0400. Nunca se commitea: *.key está en .gitignore.
secrets:
  totp_key:
    file: ./secrets/totp.key
  # La contraseña del repositorio de restic. Se genera en el servidor y se
  # guarda además FUERA de él: sin ella, las copias no se pueden abrir.
  restic_password:
    file: ./secrets/restic.password

volumes:
  postgres-data:
  backup-work:
  backup-cache:
  caddy-data:
  caddy-config:
