name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: "Go: formato, lint, tests y build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formato con gofmt
        run: make fmt-check

      - name: Análisis con go vet
        run: make vet

      - name: Tests con detector de carreras
        run: make test-race

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build para linux y meta de tamaño del agent
        run: make size-check

      - name: go.mod ordenado
        run: |
          make tidy
          git diff --exit-code
