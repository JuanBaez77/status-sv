name: CI

# Qué corre y cuándo. La cuota de minutos de Actions no alcanza para correr
# todo en cada push de cada PR: un run completo son unos 38 minutos, y 31 son de
# las pruebas de punta a punta. Así que:
#
#   - En cada PR, los jobs livianos: Go, integración y panel (unos 7 minutos).
#   - Los pesados (carga, punta a punta, deploy, deploy de systemd, alta,
#     laboratorio y metas) corren en main, a mano desde Actions
#     (workflow_dispatch, sobre cualquier rama) y en los PR con la etiqueta
#     e2e. Un PR que toca el deploy, el agent o el protocolo lleva la etiqueta.
#
# Agregar una etiqueta vuelve a disparar el workflow: los livianos no se
# repiten, y los pesados corren solo si la etiqueta que se agregó es e2e.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Un run disparado por la etiqueta va en su propio grupo: si cayera en el del
# PR, cancelaría los livianos que estén corriendo.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'etiqueta' || 'push' }}
  cancel-in-progress: true

# Las imágenes oficiales de Docker Hub se bajan por mirror.gcr.io, la caché de
# Google: los runners comparten IPs y Docker Hub sin cuenta se queda sin cupo
# (429) o contesta 500. El Dockerfile, los compose y los scripts de prueba
# leen IMAGENES; sin ella, Docker Hub, como en producción.
env:
  IMAGENES: mirror.gcr.io/library

jobs:
  go:
    name: "Go: formato, lint, tests y build"
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formato con gofmt
        run: make fmt-check

      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      - name: Código generado por sqlc al día
        run: make sqlc-check

      - name: Análisis con go vet
        run: make vet

      # Las plantillas del alta (ADR-023) se prueban con systemd-analyze verify
      # y nginx -t de verdad. systemd viene en el runner; nginx, por las dudas.
      - name: nginx para probar las plantillas
        run: |
          if ! command -v nginx >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends nginx
          fi
          nginx -v

      # STATUSSV_TEST_DOCKER prende las pruebas que usan el Docker del runner
      # (el motor de deploy compila y levanta un proyecto de juguete), y
      # STATUSSV_TEST_TOOLS las de las plantillas con systemd-analyze y nginx.
      - name: Tests con detector de carreras
        env:
          STATUSSV_TEST_DOCKER: "1"
          STATUSSV_TEST_TOOLS: "1"
        run: make test-race

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Build para linux y meta de tamaño del agent
        run: make size-check

      - name: go.mod ordenado
        run: |
          make tidy
          git diff --exit-code

  integracion:
    name: "Integración: migraciones y acceso a datos"
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    services:
      postgres:
        # Por mirror.gcr.io, como el resto de las imágenes (ver IMAGENES,
        # arriba). Acá va escrito: la imagen de un servicio no lee env.
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: statussv
          POSTGRES_PASSWORD: statussv
          POSTGRES_DB: statussv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statussv -d statussv_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Tests de integración contra PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://statussv:statussv@127.0.0.1:5432/statussv_test?sslmode=disable
        run: make test-integration

  web:
    name: "Panel: lint, tipos, tests, build y tamaño"
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

      # Meta de docs/DISENO.md: el panel no puede pasar de 300 KB comprimido.
      - name: Meta de tamaño del bundle
        run: npm run size-check

  carga:
    name: "Carga: 10 agents simulados y metas de rendimiento"
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Dos minutos alcanzan para ver la memoria del control plane con diez
      # agents y el consumo del agent de verdad. La medición larga, de diez
      # minutos, la hace el workflow nocturno contra main.
      - name: Prueba de carga
        run: ./deploy/carga/run.sh

  e2e:
    name: "Punta a punta: control plane, base y agent en Docker"
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Levanta los tres contenedores, enrola un agent de verdad y verifica que
      # el latido llegue a la base y sobreviva a un reinicio del control plane.
      - name: Prueba de punta a punta
        run: ./deploy/e2e/run.sh

  deploy:
    name: "Deploy de punta a punta: bueno, roto, rollback y agent reiniciado"
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Por mirror.gcr.io, como el resto de las imágenes (ver IMAGENES,
        # arriba). Acá va escrito: la imagen de un servicio no lee env.
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: statussv
          POSTGRES_PASSWORD: statussv
          POSTGRES_DB: statussv_deploy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statussv -d statussv_deploy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # El control plane y un agent de verdad, con el deploy prendido, sobre
      # el Docker del runner: despliega un proyecto Compose de muestra por la
      # API, como lo pide el panel (ADR-015). Mide la meta de inicio de un
      # deploy y la deja en el resumen del job.
      - name: Deploy de punta a punta
        env:
          DATABASE_URL: postgres://statussv:statussv@127.0.0.1:5432/statussv_deploy?sslmode=disable
        run: ./deploy/e2e/deploy.sh

  deploy-systemd:
    name: "Deploy de systemd de punta a punta: ayudante root, roto, rollback y agent reiniciado"
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Por mirror.gcr.io, como el resto de las imágenes (ver IMAGENES,
        # arriba). Acá va escrito: la imagen de un servicio no lee env.
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: statussv
          POSTGRES_PASSWORD: statussv
          POSTGRES_DB: statussv_deploy_systemd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statussv -d statussv_deploy_systemd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Binarios del control plane y del agent
        run: CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/bin/" ./server/cmd/server ./agent/cmd/agent

      # El agent instalado de verdad con install-agent.sh bajo el systemd del
      # runner, con su unidad endurecida y el ayudante root, desplegando por la
      # API un servicio de systemd de muestra (ADR-019). Los pasos del proyecto
      # corren con su usuario, en unidades transitorias.
      - name: Deploy de systemd de punta a punta
        env:
          DATABASE_URL: postgres://statussv:statussv@127.0.0.1:5432/statussv_deploy_systemd?sslmode=disable
        run: >-
          sudo DATABASE_URL="${DATABASE_URL}"
          SERVER_BIN="${RUNNER_TEMP}/bin/server" AGENT_BIN="${RUNNER_TEMP}/bin/agent"
          bash ./deploy/e2e/deploy-systemd.sh

  alta:
    name: "Alta de punta a punta: propuesta, aceptación, sitio y primer deploy"
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Por mirror.gcr.io, como el resto de las imágenes (ver IMAGENES,
        # arriba). Acá va escrito: la imagen de un servicio no lee env.
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: statussv
          POSTGRES_PASSWORD: statussv
          POSTGRES_DB: statussv_alta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statussv -d statussv_alta"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: nginx
        run: command -v nginx >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq nginx)

      - name: Binarios del control plane y del agent
        run: CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/bin/" ./server/cmd/server ./agent/cmd/agent

      # El alta de un proyecto de systemd y de uno de Docker (ADR-022 y
      # ADR-023) en un servidor sin proyectos: se proponen por la API, se
      # aceptan con project accept, quedan con su sitio de nginx y su
      # certificado (de un certbot de mentira) y contestan por HTTPS después
      # del primer deploy. Los valores de las variables no llegan a la base ni
      # a los registros.
      - name: Alta de punta a punta
        env:
          DATABASE_URL: postgres://statussv:statussv@127.0.0.1:5432/statussv_alta?sslmode=disable
        run: >-
          sudo DATABASE_URL="${DATABASE_URL}"
          SERVER_BIN="${RUNNER_TEMP}/bin/server" AGENT_BIN="${RUNNER_TEMP}/bin/agent"
          IMAGENES="${IMAGENES}" bash ./deploy/e2e/alta.sh

  laboratorio:
    name: "Laboratorio: la unidad del agent con el drop-in de deploy"
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Corre la unidad endurecida de verdad bajo el systemd del runner, con una
      # sonda que hace como statussv lo que hace el motor de deploy (git,
      # docker compose y la API de Docker) contra un Docker de verdad
      # (ADR-015). Si alguien endurece la unidad de más, esto lo ve. Con el
      # binario del agent, además, prueba el instalador con --enable-deploy.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Binario del agent
        run: CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/statussv-agent" ./agent/cmd/agent

      - name: Laboratorio del deploy
        run: sudo IMAGENES="${IMAGENES}" AGENT_BIN="${RUNNER_TEMP}/statussv-agent" bash ./deploy/laboratorio/deploy.sh

      # El reparto del deploy de systemd (ADR-019): el agent no ejecuta nada
      # del proyecto ni reinicia servicios; se lo pide a un ayudante root por
      # un socket, con operaciones fijas. Corre el ayudante de verdad, con
      # sus unidades tal cual se instalan.
      - name: Laboratorio del deploy de systemd
        run: sudo AGENT_BIN="${RUNNER_TEMP}/statussv-agent" bash ./deploy/laboratorio/systemd.sh

  metas:
    name: "Metas del panel: Lighthouse y latencia métrica → pantalla"
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Por mirror.gcr.io, como el resto de las imágenes (ver IMAGENES,
        # arriba). Acá va escrito: la imagen de un servicio no lee env.
        image: mirror.gcr.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: statussv
          POSTGRES_PASSWORD: statussv
          POSTGRES_DB: statussv_metas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statussv -d statussv_metas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            deploy/metas/package-lock.json

      - name: Dependencias del panel
        run: npm ci --prefix web

      # Levanta el control plane con el panel adentro y un agent de verdad, y
      # mide la carga con Lighthouse y la latencia de cada muestra hasta que se
      # dibuja. Los números quedan en el resumen del job.
      - name: Medición de las metas
        env:
          DATABASE_URL: postgres://statussv:statussv@127.0.0.1:5432/statussv_metas?sslmode=disable
          CHROME_PATH: /usr/bin/google-chrome
        run: ./deploy/metas/run.sh
