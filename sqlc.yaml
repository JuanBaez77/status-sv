version: "2"

sql:
  - engine: postgresql
    schema: server/migrations
    queries: server/internal/store/queries
    gen:
      go:
        package: store
        out: server/internal/store
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        emit_db_tags: false
        emit_json_tags: false
        overrides:
          # UUID v7 generado por la aplicación: se trabaja con uuid.UUID, no con pgtype.
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          # Las fechas son time.Time; las que pueden faltar, punteros.
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
